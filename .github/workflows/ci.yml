name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Run behavior and property tests
        run: pnpm test:run

      - name: Check TypeScript
        run: pnpm exec tsc --noEmit

      - name: Check worker performance budgets
        run: node scripts/benchmark.mjs --check-regression

      - name: Build and package
        run: pnpm package

      - name: Confirm generated outputs do not modify source
        run: git diff --exit-code

      - name: Upload verified package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuse-bead-workshop-package
          path: |
            artifacts/*.lumina-workshop
            artifacts/*.sha256
          if-no-files-found: error

