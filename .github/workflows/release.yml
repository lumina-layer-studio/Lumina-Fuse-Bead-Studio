name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Run behavior and property tests
        run: pnpm test:run

      - name: Check TypeScript
        run: pnpm exec tsc --noEmit

      - name: Check worker performance budgets
        run: node scripts/benchmark.mjs --check-regression

      - name: Build and package
        run: pnpm package

      - name: Verify immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          manifest_version="$(node -p "require('./manifest.json').version")"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
          test "${manifest_version}" = "${package_version}"

          asset="artifacts/lumina.bead-pattern-${package_version}.lumina-workshop"
          checksum="${asset}.sha256"
          test -f "${asset}"
          test -f "${checksum}"
          test "$(find artifacts -maxdepth 1 -type f | wc -l | tr -d ' ')" = "2"
          (
            cd artifacts
            sha256sum -c "$(basename "${checksum}")"
          )

      - name: Confirm generated outputs do not modify source
        run: git diff --exit-code

      - name: Publish exact versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="${GITHUB_REF_NAME#v}"
          asset="artifacts/lumina.bead-pattern-${package_version}.lumina-workshop"
          gh release create "${GITHUB_REF_NAME}" \
            "${asset}" \
            "${asset}.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Fuse Bead Studio ${GITHUB_REF_NAME}" \
            --notes "Official Lumina Workshop module release ${GITHUB_REF_NAME}."
